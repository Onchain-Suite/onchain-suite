name: CI

on:
  push:
    branches: [dev, main, staging]
  pull_request:
    branches: [dev, main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run type-check

      # The whole suite gates now - the previously-quarantined suites (MCP
      # stream mocks, the in-app integration tab, the audience-step links, and
      # the campaigns list view) were fixed and pass. Any failure blocks.
      - name: Tests
        run: bun run test:run

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Guard the production /blog 500 (ERR_DLOPEN_FAILED: libvips-cpp.so).
      # PayloadCMS dlopens sharp's native libvips at runtime, so next.config.ts
      # must trace the linux sharp packages into the server functions, AND sharp
      # must actually load + run on linux-x64 (Vercel's runtime = this runner).
      # This fails if the trace fix is removed, the linux binaries drop out of
      # the lockfile, or sharp/libvips can't load on linux.
      - name: Guard sharp/libvips native load (Vercel /blog)
        run: |
          node -e '
            const fs = require("fs");
            const cfg = fs.readFileSync("next.config.ts", "utf8");
            if (!cfg.includes("sharp-libvips-linux-x64")) {
              console.error("next.config.ts no longer traces @img/sharp-libvips-linux-x64 - /blog will 500 on Vercel (ERR_DLOPEN_FAILED). Restore outputFileTracingIncludes.");
              process.exit(1);
            }
            let sharp;
            try { sharp = require("sharp"); }
            catch (e) { console.error("sharp failed to load on linux-x64:", e.message); process.exit(1); }
            sharp({ create: { width: 1, height: 1, channels: 3, background: { r: 0, g: 0, b: 0 } } })
              .png().toBuffer()
              .then(() => console.log("OK: sharp + libvips load and run on linux-x64."))
              .catch((e) => { console.error("sharp/libvips runtime failure on linux:", e.message); process.exit(1); });
          '

      - name: Build
        run: bun run build
