name: CI

on:
  push:
    branches: [dev, main, staging]
  pull_request:
    branches: [dev, main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run type-check

      # The whole suite gates now - the previously-quarantined suites (MCP
      # stream mocks, the in-app integration tab, the audience-step links, and
      # the campaigns list view) were fixed and pass. Any failure blocks.
      - name: Tests
        run: bun run test:run

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
